name: ci

# Verify, on pull requests into develop and main — the essential checks, on Linux only:
#   compile  bash 3.2 syntax (the macOS default), the PowerShell parse, every environment's and the edge's
#            Compose file renders, and the release manifest matches its schema
#   lint     shellcheck, PSScriptAnalyzer, ASCII-only PowerShell, the repository hygiene checks
#   parity   bash and PowerShell issue the same Docker commands (no Docker daemon needed)
#   secrets  gitleaks over the pull request's commits
# The packaging dry run, the Windows PowerShell 5.1 checks and a smoke start run locally before a release
# (AGENTS.md). No application images are built here.
on:
  pull_request:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the pull request's commits, for the secret scan
          persist-credentials: false

      - name: Repository hygiene
        run: |
          tests/checks/check-tracked-files.sh
          tests/checks/check-optional-env.sh
          tests/checks/check-zones.sh

      - name: Compile (bash 3.2, PowerShell, Compose, manifest)
        shell: bash
        run: |
          docker run --rm -v "$PWD:/w:ro" -w /w mirror.gcr.io/library/bash:3.2@sha256:0fd7cb8499c63a3c9345e7088a9cd83bb69f6e895e83833859aff838a0312091 \
            sh -c 'for f in core/scripts/common.sh macos/*/*.sh linux/*/*.sh; do bash -n "$f" || exit 1; done'
          # shellcheck disable=SC2016 # PowerShell expands this code itself
          pwsh -NoProfile -Command '$e = $null; $t = $null; [void][System.Management.Automation.Language.Parser]::ParseFile("$PWD/core/scripts/QeetIdKit.ps1", [ref]$t, [ref]$e); if ($e) { $e | ForEach-Object { Write-Error $_.ToString() }; exit 1 }'
          fixture=$(mktemp -d)
          release/release-manifest.sh to-env release/example.manifest.json > "$fixture/release.env"
          for env in dev test staging; do
            QEET_KIT_ENV=$env QEET_KIT_STATE_DIR=$fixture QEET_KIT_IMAGE=qeet-id-test-kit:ci \
              docker compose --project-name "qeet-id-$env" --project-directory . \
              --file core/compose.yaml --env-file "environments/$env.env" --env-file "$fixture/release.env" \
              config --no-env-resolution --quiet
          done
          QEET_KIT_STATE_DIR=$fixture docker compose --project-name qeet-id-edge --project-directory . \
            --file core/edge.compose.yaml config --quiet
          pipx run check-jsonschema==0.38.2 --schemafile release/manifest.schema.json release/example.manifest.json
          if grep -vE '^QEET_ID_[A-Z0-9_]+=[A-Za-z0-9@:/._+,-]*$' "$fixture/release.env"; then exit 1; fi

      - name: Format and lint
        shell: bash
        run: |
          shellcheck -x -P SCRIPTDIR core/scripts/common.sh core/image/keygen.sh macos/*/*.sh linux/*/*.sh \
            release/*.sh tests/checks/*.sh tests/parity/run.sh tests/parity/kit.sh tests/parity/docker tests/smoke/*.sh
          if LC_ALL=C grep -nP '[^\x00-\x7F]' core/scripts/QeetIdKit.ps1 windows/*/*.cmd; then exit 1; fi
          # shellcheck disable=SC2016 # PowerShell expands this code itself
          pwsh -NoProfile -Command '
            foreach ($attempt in 1..3) {
              try { Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force -ErrorAction Stop; break }
              catch { if ($attempt -eq 3) { throw }; Start-Sleep -Seconds 10 }
            }
            $r = Invoke-ScriptAnalyzer -Path core/scripts/QeetIdKit.ps1 -Settings tests/PSScriptAnalyzerSettings.psd1
            if ($r) { $r | Format-Table -AutoSize | Out-String | Write-Host; exit 1 }'

      - name: bash / PowerShell parity
        run: tests/parity/run.sh bash pwsh

      # The free gitleaks CLI (the gitleaks Action needs a paid licence for an organisation), pinned and checksum-verified,
      # over this pull request's commits.
      - name: Secret scan
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          (cd "$RUNNER_TEMP" && echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict && tar -xzf "$archive" gitleaks)
          "$RUNNER_TEMP/gitleaks" git --redact --exit-code 1 --log-opts="$BASE_SHA..$HEAD_SHA" .
