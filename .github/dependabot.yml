# Keeps the pinned GitHub Actions and the kit image's base image current: one pull request a month each, into develop.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    target-branch: develop
  - package-ecosystem: docker
    directory: /core/image
    schedule:
      interval: monthly
    target-branch: develop
