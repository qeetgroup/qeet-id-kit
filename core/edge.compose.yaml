# Qeet ID Kit — shared local edge (project qeet-id-edge).
#
# The ONLY container that publishes host ports: 127.0.0.1:80 and 127.0.0.1:443
# (loopback — never reachable from the network). It routes by Host to the DEV,
# TEST and STAGING environments, which run as separate Compose projects
# (compose.yaml) and can be up at the same time:
#   <scheme>://{console,login,api,mail}.<zone>  ->  <env>-{console,login,server,mail}
#   <scheme>://<zone>  ->  /.well-known/assetlinks.json (Qeet ID on Android), else the console
# with each environment's zone and scheme from environments/<env>.env:
#   TEST     https://*.test.id.qeet.in
#   STAGING  https://*.staging.id.qeet.in
#   DEV      https://*.dev.id.qeet.in
# (http:// on any of them redirects to https://)
# Keep the `import environment` lines below and those files in step
# (tests/checks/check-zones.sh).
#
# It joins each environment's edge network (created by the kit before either
# project starts) and dials only <env>-prefixed aliases, so one environment's
# hostname can never resolve to another's service. PostgreSQL is never on these
# networks. On each edge network it also answers to that environment's public
# hostnames, so server-side calls (login rendering, the console BFF) use the same
# origin as the browser.
#
# Every zone is public (<env>.id.qeet.in, whose DNS points at 127.0.0.1), so
# passkeys and Secure cookies need https there. Its certificates are issued
# here, short-lived and renewed automatically, from this computer's own
# certificate authority (the `ca` tool below, core/image/ca.sh), which is
# name-constrained to the kit zones. Start asks once to trust it on this computer.
# (A *.localhost zone over plain http would also work: browsers treat it as a
# secure context. No environment uses one since kit 1.4.0.)
# Caddy preserves Host and sets X-Forwarded-For / X-Forwarded-Proto; the servers
# run with TRUSTED_PROXY_HOPS=1.
#
# Lifecycle (kit commands): any Start brings it up; it stops when the last
# environment stops, or with Stop All.

name: qeet-id-edge

services:
  edge:
    image: mirror.gcr.io/library/caddy:2.11.4-alpine@sha256:6aeddd44c3078b0f9a35206472a11420648a79c184603ef95957d0a20044cb2b
    ports:
      - "127.0.0.1:80:80"
      - "127.0.0.1:443:443"
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    volumes:
      # This computer's certificate authority (read-only; the key stays here).
      - type: bind
        source: ${QEET_KIT_STATE_DIR:?run the kit through its macos/, linux/ or windows/ commands}/edge/ca
        target: /ca
        read_only: true
        bind:
          create_host_path: false
    networks:
      # On each environment's network, every name of that environment: for
      # server-side calls, and for the kit's https route check.
      dev:
        aliases: [api.dev.id.qeet.in, login.dev.id.qeet.in, console.dev.id.qeet.in, mail.dev.id.qeet.in, dev.id.qeet.in]
      test:
        aliases: [api.test.id.qeet.in, login.test.id.qeet.in, console.test.id.qeet.in, mail.test.id.qeet.in, test.id.qeet.in]
      staging:
        aliases: [api.staging.id.qeet.in, login.staging.id.qeet.in, console.staging.id.qeet.in, mail.staging.id.qeet.in, staging.id.qeet.in]
    healthcheck:
      test: ["CMD", "wget", "-Y", "off", "-q", "-O", "/dev/null", "http://127.0.0.1:2080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 96m # measured peak 51 MiB x 1.5
    restart: on-failure:3
    stop_grace_period: 10s
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

  # One-shot: creates this computer's certificate authority (never replaces it).
  ca:
    profiles: [tools]
    image: ${QEET_KIT_IMAGE:-qeet-id-test-kit:dev}
    user: "${QEET_KIT_UID:-0}:${QEET_KIT_GID:-0}"
    network_mode: none
    volumes:
      - ${QEET_KIT_STATE_DIR:?}/edge/ca:/out
    command: ["qeet-kit-ca", "/out"]
    restart: "no"

configs:
  caddyfile:
    content: |
      {
      	admin off
      	persist_config off
      	# https sites get certificates from the local CA below, never from a
      	# public CA; http->https redirects are explicit (to-https).
      	local_certs
      	auto_https disable_redirects
      	skip_install_trust
      	pki {
      		ca local {
      			name "Qeet ID Kit"
      			root {
      				cert /ca/root.crt
      				key /ca/root.key
      			}
      		}
      	}
      }

      # Internal liveness for the container health check (not published).
      :2080 {
      	respond /healthz "ok" 200
      }

      # A stopped environment gets a pointer instead of a bare 502.
      (not-running) {
      	handle_errors 502 503 504 {
      		respond "Qeet ID {args[0]} is not running on this computer. Start it with: Start {args[1]}." 503
      	}
      }

      # Qeet ID on Android may use an environment's passkeys to sign in: the statement
      # id.qeet.in publishes, for the same signing certificate. Keep the fingerprint in
      # step with QEET_KIT_APP_ORIGINS in environments/*.env (the same key, base64url).
      (assetlinks) {
      	header Content-Type application/json
      	respond `[{"relation":["delegate_permission/common.get_login_creds"],"target":{"namespace":"android_app","package_name":"com.qeetgroup.qeetid","sha256_cert_fingerprints":["F9:E9:29:A0:D8:00:B8:12:5A:6E:D9:2F:DC:1F:DB:6F:21:AF:78:6D:09:1F:D6:30:07:51:37:4A:BF:92:24:16"]}}]` 200
      }

      # One environment: args = <env> <LABEL> <Command word> <scheme> <zone>.
      (environment) {
      	{args[3]}://api.{args[4]} {
      		reverse_proxy {args[0]}-server:4001
      		import not-running {args[1]} {args[2]}
      	}
      	{args[3]}://login.{args[4]} {
      		reverse_proxy {args[0]}-login:3000
      		import not-running {args[1]} {args[2]}
      	}
      	{args[3]}://console.{args[4]} {
      		reverse_proxy {args[0]}-console:3000
      		import not-running {args[1]} {args[2]}
      	}
      	{args[3]}://mail.{args[4]} {
      		reverse_proxy {args[0]}-mail:8025
      		import not-running {args[1]} {args[2]}
      	}
      	# The bare zone: the passkey statement, and anything else goes to the console.
      	{args[3]}://{args[4]} {
      		handle /.well-known/assetlinks.json {
      			import assetlinks
      		}
      		handle {
      			redir {args[3]}://console.{args[4]}/ 302
      		}
      	}
      }

      # An https environment's http:// addresses: args = <zone>.
      (to-https) {
      	http://{args[0]}, http://*.{args[0]} {
      		redir https://{host}{uri} 308
      	}
      }

      import environment dev DEV Dev https dev.id.qeet.in
      import to-https dev.id.qeet.in
      import environment test TEST Test https test.id.qeet.in
      import to-https test.id.qeet.in
      import environment staging STAGING Staging https staging.id.qeet.in
      import to-https staging.id.qeet.in

      # Anything else (http://localhost, a typo) gets the list of addresses.
      :80 {
      	respond "Not a Qeet ID address. TEST: https://console.test.id.qeet.in  STAGING: https://console.staging.id.qeet.in  DEV: https://console.dev.id.qeet.in" 404
      }

networks:
  dev:
    name: qeet-id-dev-edge
    external: true
  test:
    name: qeet-id-test-edge
    external: true
  staging:
    name: qeet-id-staging-edge
    external: true
